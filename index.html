const CP={w:'50% 50%',p:'50% 62%',f:'50% 55%',m:'50% 45%'};
const cpic=c=>`<img src="${CI[c.id]||DIR+'/'+CN[c.id]+'.jpg'}" alt="" style="object-position:${CP[c.id]}" onerror="this.remove()">`;
const gp=i=>P.find(p=>p.i==i),gpn=n=>P.find(p=>p.ar==n),cat=p=>C.find(c=>c.id==p.c),ci=p=>cat(p).i,cc=p=>nm(cat(p));
const zp=(p,z)=>(p.sz.length&&p.szp[z])||p.p;
const gal=p=>[p.img,...p.cimg,...p.ex].filter((f,i,a)=>f&&a.indexOf(f)==i);
const colL=(p,i)=>S.l=='ar'?p.cols[i]:(p.cen[i]||p.cols[i]),szL=(p,i)=>S.l=='ar'?p.sz[i]:(p.sen[i]||p.sz[i]);
const live=()=>S.cart.map((x,k)=>({...x,k,p:gpn(x.n)})).filter(x=>x.p),avail=()=>live().filter(x=>!x.p.out),cnt=()=>avail().reduce((a,x)=>a+x.q,0);
const save=()=>{try{localStorage.setItem('cart2',JSON.stringify(S.cart))}catch(e){}};
function clean(valid){const m=new Map();(Array.isArray(S.cart)?S.cart:[]).forEach(x=>{if(!x||typeof x.n!='string')return;const q=Math.min(99,Math.floor(+x.q));if(!(q>=1))return;let col=Math.max(0,+x.col||0),sz=Math.max(0,+x.sz||0);if(valid){const p=gpn(x.n);if(!p)return;col=Math.min(col,Math.max(0,p.cols.length-1));sz=Math.min(sz,Math.max(0,p.sz.length-1))}const k=x.n+'|'+col+'|'+sz,e=m.get(k);if(e)e.q=Math.min(99,e.q+q);else m.set(k,{n:x.n,col,sz,q})});S.cart=[...m.values()];save()}
const wl=m=>'https://wa.me/'+WA+'?text='+encodeURIComponent(m);
function order(items){let tot=0,m=HI;items.forEach(x=>{const p=x.p,s=zp(p,x.sz)*x.q;tot+=s;const o=[p.cols.length?(p.cen[x.col]||p.cols[x.col]):'',p.sz.length?(p.sen[x.sz]||p.sz[x.sz]):''].filter(Boolean).join(', ');m+='\n'+p.en+(o?' ('+o+')':'')+' × '+x.q+' = '+prE(s)});return m+'\nTotal: '+prE(tot)}
const card=p=>`<div class="cd${p.out?' sold':''}" role="button" tabindex="0" data-a="p" data-id="${p.i}"><div class="ph">${ic(ci(p),48)}${pic(gal(p)[0],gal(p).slice(1))}${p.out?`<span class="sob">${t('out')}</span>`:''}</div><small>${cc(p)}</small><h3>${nm(p)}</h3><p>${pr(p.p)}</p></div>`;
function home(){const l=P;
return `<section class="tl">${C.map(c=>`<button class="cat" data-a="c" data-id="${c.id}"><span class="sq">${cpic(c)}</span><span class="cnm">${nm(c)}</span></button>`).join('')}</section>
<h2 class="sec">${t('best')}</h2>
<div class="hs">${l.map(card).join('')}</div>
<div class="ctr"><button class="bt" data-a="c" data-id="all">${t('all')}</button></div>`}
function list(){const c=C.find(x=>x.id==S.c),l=S.c?P.filter(p=>p.c==S.c):P;

function prod(){const p=gp(S.pid);if(!p){S.v='home';return home()}
const imgs=gal(p),main=imgs[S.im]||p.img||'';
const grp=(k,arr,sel,a)=>arr.length?`<div class="cl">${t(k)}</div><div class="ch" role="group">${arr.map((v,i)=>`<button class="${i==sel?'on':''}" data-a="${a}" data-id="${i}">${v}</button>`).join('')}</div>`:'';
const ct=S.cart.map(x=>({p:gpn(x.n),col:x.col,sz:x.sz,q:x.q})).filter(x=>x.p&&!x.p.out),inC=ct.some(x=>x.p===p&&x.col==S.col&&x.sz==S.sz),msg=order(inC?ct:[...ct,{p,col:S.col,sz:S.sz,q:1}]),extra=ct.length;
return `<div class="pp"><button class="bk" data-a="back">${ic('k',20)}${t('back')}</button><h1>${nm(p)}</h1>
<div class="gal${imgs.length>1?'':' one'}">${imgs.length>1?`<div class="th">${imgs.map((f,i)=>`<button class="${i==S.im?'on':''}" data-a="im" data-id="${i}" aria-label="${i+1}">${pic(f)}</button>`).join('')}</div>`:''}<div class="ph">${ic(ci(p),72)}${pic(main)}</div></div>
<div class="pc">${pr(zp(p,S.sz))}</div>${grp('color',p.cols.map((_,i)=>colL(p,i)),S.col,'col')}${grp('size',p.sz.map((_,i)=>szL(p,i)),S.sz,'sz')}
${p.out?`<div class="bs"><div class="sold-msg">${t('out')}</div></div>`:`<div class="bs"><button class="bt" data-a="add">${t('add')}</button><a class="bt o" href="${wl(msg)}" target="_blank" rel="noopener">${t('wa')}</a></div>${extra?`<p class="hint">${t('incl')}</p>`:''}`}<p class="ds">${ds(p)}</p></div>`}
function cartv(){const all=live(),it=all.filter(x=>!x.p.out),so=all.filter(x=>x.p.out);let tot=0;const sor=so.map(x=>`<div class="ci so"><div class="cth">${ic(ci(x.p),28)}</div><div><b>${nm(x.p)}</b><div class="ds out">${t('out')}</div></div><div><button class="ib" data-a="del" data-i="${x.k}" aria-label="${t('close')}">${ic('x',18)}</button></div></div>`).join('');
const rows=it.map(x=>{const p=x.p,s=zp(p,x.sz)*x.q;tot+=s;const o=[p.cols.length?colL(p,x.col):'',p.sz.length?szL(p,x.sz):''].filter(Boolean).join(' · ');
return `<div class="ci"><div class="cth">${ic(ci(p),28)}${(()=>{const g=gal(p),f=(p.cols.length&&p.cimg[x.col])||g[0];return pic(f,g.filter(y=>y!=f),false)})()}</div><div><b>${nm(p)}</b>${o?`<div class="ds">${o}</div>`:''}<div class="q"><button data-a="dec" data-i="${x.k}" aria-label="-">&minus;</button><span>${x.q}</span><button data-a="inc" data-i="${x.k}" aria-label="+">+</button></div></div><div><b>${pr(s)}</b><button class="ib" data-a="del" data-i="${x.k}" aria-label="${t('close')}">${ic('x',18)}</button></div></div>`}).join('');
return `<div style="display:flex;justify-content:space-between;align-items:center"><h2>${t('cart')}</h2><button class="ib" data-a="x" aria-label="${t('close')}">${ic('x')}</button></div>`+(it.length?rows+sor+`<div class="tt"><span>${t('tot')}</span><span>${pr(tot)}</span></div><a class="bt" href="${wl(order(it))}" target="_blank" rel="noopener">${t('wa')}</a>`:sor+`<p class="ds" style="margin-top:16px">${t('empty')}</p>`)}
function R(){document.documentElement.lang=S.l;document.documentElement.dir=S.l=='ar'?'rtl':'ltr';
$('#hd').innerHTML=`<div class="lsw" role="group" aria-label="Language"><button class="${S.l=='ar'?'on':''}" data-a="lang" data-id="ar">AR</button><button class="${S.l=='en'?'on':''}" data-a="lang" data-id="en">EN</button></div><div class="lg" data-a="home" style="cursor:pointer"><b>Rifal<small> store</small></b></div><div class="ic"><button class="ib" data-a="srch" aria-label="${t('sr')}">${ic('s')}</button><button class="ib" data-a="cart" aria-label="${t('cart')}">${ic('b')}${cnt()?`<em${S.bump?' class="bump"':''}>${cnt()}</em>`:''}</button></div>`;
$('#main').innerHTML=S.v=='home'?home():S.v=='list'?list():prod();
$('#cb').innerHTML=cartv();{const L=[[IG,'i','Instagram'],[FB,'f','Facebook']].filter(x=>x[0]);$('#ft').innerHTML=L.length?`<p>${t('fol')}</p><div class="so">${L.map(x=>`<a href="${x[0]}" target="_blank" rel="noopener" aria-label="${x[2]}">${ic(x[1])}</a>`).join('')}</div>`:''}$('#q').placeholder=t('sr');fs()}
function fs(){const q=$('#q').value.trim().toLowerCase();const l=q?P.filter(p=>(p.ar+' '+p.en).toLowerCase().includes(q)):P;$('#sres').innerHTML=l.length?l.map(card).join(''):`<p class="ds" style="grid-column:1/-1;text-align:center">${t('no')}</p>`}
function cl(){['#cart','#srch','#sc'].forEach(s=>$(s).classList.remove('on'))}
function op(a){cl();$(a=='cart'?'#cart':'#srch').classList.add('on');if(a!='srch')$('#sc').classList.add('on');else $('#q').focus()}
const CK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';let tmo;
function toast(m){const e=$('#ts');e.innerHTML=`<i class="ck">${CK}</i><span>${m}</span><button data-a="cart">${t('view')}</button>`;e.classList.add('on');clearTimeout(tmo);tmo=setTimeout(()=>e.classList.remove('on'),3500)}
const snap=()=>({v:S.v,c:S.c,pid:S.pid,col:S.col,sz:S.sz,im:S.im,y:scrollY});
let D=0,HS=true;const ST=[];
try{history.replaceState({s:snap(),d:0},'')}catch(e){HS=false}
function go(v){const prev=snap();ST.push(prev);try{history.replaceState({s:prev,d:D},'')}catch(e){HS=false}S.v=v;cl();R();scrollTo(0,0);D++;try{history.pushState({s:{...snap(),y:0},d:D},'')}catch(e){HS=false}}
function rst(x){Object.assign(S,x||{v:'home',c:null,pid:null,col:0,sz:0,im:0});cl();R();scrollTo(0,(x&&x.y)||0)}
addEventListener('popstate',e=>{const st=e.state;D=st?st.d:0;ST.length=D;rst(st&&st.s)});
function back(){if(HS&&D>0)history.back();else if(ST.length)rst(ST.pop());else go('home')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,i=+el.dataset.i;
if(a=='cart'||a=='srch')op(a);
else if(a=='x')cl();
else if(a=='p'){const p=gp(+id);S.pid=+id;S.col=S.sz=0;S.im=Math.max(0,gal(p).indexOf(p.cimg[0]));go('prod')}
else if(a=='c'){S.c=id=='all'?null:id;go('list')}
else if(a=='home')go('home');
else if(a=='back')back();
else if(a=='tab'){S.tab=id;R()}
else if(a=='col'){const p=gp(S.pid),f=p.cimg[+id];S.col=+id;if(f)S.im=gal(p).indexOf(f);R()}
else if(a=='sz'){S.sz=+id;R()}
else if(a=='im'){const p=gp(S.pid),j=p.cimg.indexOf(gal(p)[+id]);S.im=+id;if(j>=0)S.col=j;R()}
else if(a=='lang'){S.l=id;R()}
else if(a=='add'){const p=gp(S.pid);if(p.out)return;const k=S.cart.find(x=>x.n==p.ar&&x.col==S.col&&x.sz==S.sz);k?k.q=Math.min(99,k.q+1):S.cart.push({n:p.ar,col:S.col,sz:S.sz,q:1});save();S.bump=1;R();S.bump=0;toast(t('added'))}
else if(a=='inc'){S.cart[i].q=Math.min(99,S.cart[i].q+1);save();R()}
else if(a=='dec'){S.cart[i].q--;if(S.cart[i].q<1)S.cart.splice(i,1);save();R()}
else if(a=='del'){S.cart.splice(i,1);save();R()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')cl();if(e.key=='Enter'&&e.target.matches('[role=button]'))e.target.click()});
$('#q').addEventListener('input',fs);
clean(false);
const SK='sheet3',TTL=300000;let shc=null;try{shc=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}
if(shc&&shc.x){const d=build(shc.x);if(d.length){P=d;clean(true)}}
R();
if(!shc||!shc.t||Date.now()-shc.t>TTL)(async()=>{try{const r=await fetch('https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(TAB),{cache:'no-store'});if(!r.ok)return;const x=await r.text(),d=build(x);if(d.length){P=d;try{localStorage.setItem(SK,JSON.stringify({t:Date.now(),x}))}catch(e){}clean(true);R()}}catch(e){}})();
</script>
